<title>Westbrook School Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: institutional ERP, light only — white header and rail, quiet slate workspace, one deep-blue primary; state shown by semantic pills only */
:root{
  --bg:#F4F6F9;--surface:#FFFFFF;--sunk:#EDF0F4;--line:#DCE1E8;--line-2:#C5CDD8;
  --ink:#121A27;--ink-2:#465267;--muted:#6F7B90;
  --primary:#1D4F91;--primary-hover:#173F75;--primary-ink:#FFFFFF;--primary-soft:#E5EDF8;--primary-text:#1D4F91;
  --side:#101B2D;--side-2:#1C2A42;--side-ink:#A9B5C9;--side-hi:#FFFFFF;
  --ok:#18794E;--ok-soft:#E2F2E9;--bad:#B42318;--bad-soft:#FBE6E3;--warn:#935705;--warn-soft:#FBEFD9;
  --shadow:0 1px 2px rgba(16,27,45,.05),0 4px 14px -8px rgba(16,27,45,.14);
  --f-sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* Neutral greys shared by every palette */
:root{color-scheme:light;--accent2:#F5B800;--accent2-ink:#2B2000;--accent2-soft:#FFF5D1;--bg:#F7F8FA;--surface:#FFFFFF;--side:#FFFFFF;--side-2:var(--primary-soft);--side-ink:#4A515C;--side-hi:var(--primary-text);--sunk:#EEF0F2;--line:#DFE2E6;--line-2:#C9CED5;--ink:#15191F;--ink-2:#4A515C;--muted:#737A86}

/* School colour palettes (chosen in Admin › School settings) */
:root[data-palette="blue"]{--primary:#1F5BC6;--primary-hover:#1A4CA6;--primary-soft:#E8EFFC;--primary-text:#1A50B3;--accent2:#F5B800;--accent2-ink:#2B2000;--accent2-soft:#FFF5D1}
:root[data-palette="teal"]{--primary:#0E6B67;--primary-hover:#0A5552;--primary-soft:#E0F0EE;--primary-text:#0E6B67;--accent2:#F2A900;--accent2-ink:#2A1E00;--accent2-soft:#FFF4D6}
:root[data-palette="maroon"]{--primary:#8C1D40;--primary-hover:#721633;--primary-soft:#F6E4EA;--primary-text:#8C1D40;--accent2:#E0A419;--accent2-ink:#2A1D00;--accent2-soft:#FFF3D6}
:root[data-palette="navy"]{--primary:#1D4F91;--primary-hover:#173F75;--primary-soft:#E5EDF8;--primary-text:#1D4F91;--accent2:#F5B800;--accent2-ink:#2B2000;--accent2-soft:#FFF5D1}
:root[data-palette="forest"]{--primary:#2F6B2F;--primary-hover:#245224;--primary-soft:#E5F0E3;--primary-text:#2F6B2F;--accent2:#E3A92B;--accent2-ink:#2A1E00;--accent2-soft:#FFF3D9}
:root[data-palette="graphite"]{--primary:#2F3640;--primary-hover:#1F252C;--primary-soft:#E9EBEE;--primary-text:#2F3640;--accent2:#F28C28;--accent2-ink:#2A1400;--accent2-soft:#FFEBD9}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:6px 10px 6px 6px;cursor:pointer;font-size:.84rem;font-weight:500;color:var(--ink)}
.swatch i{width:22px;height:22px;border-radius:5px;display:block}
.swatch[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.side .swatches{gap:6px;margin-top:10px}
.side .swatch{padding:0;border:2px solid transparent;background:none;border-radius:6px}
.side .swatch[aria-pressed="true"]{border-color:var(--primary);box-shadow:none}
.side .swatch i{width:18px;height:18px;border-radius:3px}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-sans);font-size:14.5px;line-height:1.5}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:600}h3{font-size:1rem;font-weight:600}h4{font-size:.92rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:.85rem}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--accent2);padding:10px 20px;display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.crest{width:36px;height:36px;border-radius:8px;background:var(--primary);color:var(--accent2);box-shadow:inset 0 -3px 0 var(--accent2);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.04em;flex:none}
.brand b{display:block;font-weight:600;font-size:.98rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:.76rem;color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:6px;cursor:pointer;font-weight:500;font-size:.85rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);font-weight:600;box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who select{padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface);max-width:240px;font-size:.86rem}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 58px)}
.side{background:var(--side);padding:18px 12px;color:var(--side-ink);border-right:1px solid var(--line)}
.side nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px}
.side .label{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:4px 12px 10px}
.side button{display:flex;align-items:center;gap:11px;border:0;background:none;text-align:left;padding:9px 12px;border-radius:7px;cursor:pointer;color:var(--side-ink);font-size:.89rem;font-weight:500;white-space:nowrap}
.side button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side button:hover{background:var(--sunk);color:var(--ink)}
.side button[aria-current="page"]{background:var(--side-2);color:var(--side-hi);font-weight:600;box-shadow:inset 3px 0 0 var(--accent2)}
.side .count{margin-left:auto;font-family:var(--f-mono);font-size:.7rem;font-weight:600;background:var(--accent2);color:var(--accent2-ink);border-radius:4px;padding:1px 6px}
.side .foot{margin-top:22px;padding:12px;font-size:.76rem;line-height:1.45;border-top:1px solid var(--line);color:var(--muted)}
main{padding:26px 30px 70px;min-width:0;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.head p{color:var(--ink-2);margin-top:5px;max-width:68ch}
.head .eyebrow{color:var(--primary-text);display:inline-flex;align-items:center;gap:8px}
.head .eyebrow::before{content:"";width:14px;height:3px;border-radius:2px;background:var(--accent2)}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.panel-h p{width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent2);border-radius:10px;box-shadow:var(--shadow)}
.stat{padding:15px 18px;display:flex;flex-direction:column;gap:5px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .n{font-size:1.75rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat .n small{font-size:.9rem;color:var(--muted);font-weight:500}
.stat .s{font-size:.78rem;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row:last-child{padding-bottom:0}
.grow{flex:1;min-width:0}
.row b{display:block;font-weight:600}
.empty{padding:20px;border:1px dashed var(--line-2);border-radius:8px;color:var(--muted);text-align:center;font-size:.88rem}

/* forms */
.form{display:grid;gap:12px}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label.f{display:grid;gap:5px;font-size:.8rem;font-weight:600;color:var(--ink-2);min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=email],input[type=tel],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);font-size:.92rem}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
textarea{resize:vertical;min-height:80px}
input[type=file]{font-size:.84rem;color:var(--ink-2);max-width:100%}
input[type=file]::file-selector-button{border:1px solid var(--line-2);background:var(--sunk);padding:7px 12px;border-radius:6px;margin-right:10px;cursor:pointer;font-weight:500;color:var(--ink)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:7px;padding:8px 15px;font-weight:600;cursor:pointer;font-size:.86rem;white-space:nowrap;line-height:1.3}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.link{background:none;padding:3px 4px;color:var(--primary-text);font-weight:500}
.btn.link:hover{text-decoration:underline}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* pills and chips */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.73rem;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-info{background:var(--primary-soft);color:var(--primary-text)}
.p-mute{background:var(--sunk);color:var(--ink-2)}
.code{font-family:var(--f-mono);font-size:.68rem;font-weight:600;letter-spacing:.04em;padding:2px 6px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);padding:5px 11px;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.chip.sm{padding:2px 8px;font-size:.74rem}

/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
td{white-space:nowrap}
td.wrap{white-space:normal;min-width:200px}
th{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
.r{text-align:right}
td.num,th.r{text-align:right}
.roll{font-family:var(--f-mono);color:var(--muted);font-size:.8rem}
.mini{width:84px;padding:6px 8px!important;text-align:right;font-family:var(--f-mono)}
.mark{display:inline-flex;gap:4px}
.mark button{width:34px;height:30px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);font-family:var(--f-mono);font-weight:600;font-size:.8rem;cursor:pointer;color:var(--muted)}
.mark button[aria-pressed="true"][data-v="P"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.mark button[aria-pressed="true"][data-v="A"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.mark button[aria-pressed="true"][data-v="L"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.att{font-family:var(--f-mono);font-weight:600;font-size:.78rem;display:inline-block;width:22px;text-align:center;border-radius:4px}
.att.P{color:var(--ok)}.att.A{color:var(--bad);background:var(--bad-soft)}.att.L{color:var(--warn);background:var(--warn-soft)}.att.x{color:var(--line-2)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:60px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.lo i{background:var(--bad)}

/* timetable */
.tt{min-width:720px;table-layout:fixed}
.tt th:first-child,.tt td:first-child{width:62px}
.tt th small{display:block;font-family:var(--f-mono);font-weight:500;letter-spacing:0;text-transform:none;font-size:.68rem}
.tt td{padding:5px;border-left:1px solid var(--line);white-space:normal}
.tt td.day{font-weight:600;color:var(--ink-2);border-left:0;padding-left:10px}
.slot{display:flex;flex-direction:column;gap:2px;width:100%;min-height:52px;padding:7px 8px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);text-align:left;font-size:.8rem;line-height:1.25}
.slot b{font-weight:600;color:var(--ink)}
.slot span{color:var(--muted);font-size:.74rem}
.slot.filled{background:var(--primary-soft);border-color:transparent}
.slot.empty-s{border-style:dashed;background:transparent;color:var(--muted);align-items:center;justify-content:center}
button.slot{cursor:pointer}
button.slot:hover{border-color:var(--primary)}
button.slot[aria-pressed="true"]{outline:2px solid var(--primary);outline-offset:1px}
.slot.today{box-shadow:inset 0 0 0 2px var(--accent2);background:var(--accent2-soft)}

/* gantt */
.gantt{display:flex;flex-direction:column;gap:2px}
.g-row{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr) 104px;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.g-row:first-child{border-top:0}
.g-row b{display:block;font-weight:600;font-size:.88rem}
.g-track{position:relative;height:14px;background:var(--sunk);border-radius:3px}
.g-bar{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--line-2)}
.g-bar.done{background:var(--ok)}.g-bar.now{background:var(--primary)}
.g-today{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--accent2)}
.g-axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);grid-column:2}
.g-row .r{text-align:right}

/* note card */
.mat{display:flex;flex-direction:column;gap:8px;padding:16px 0;border-top:1px solid var(--line)}
.mat:first-child{border-top:0;padding-top:0}
.mat .body{white-space:pre-wrap;color:var(--ink-2);max-width:72ch}
.mat .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.attach{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);font-size:.82rem;max-width:100%;align-self:flex-start}
.attach span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{max-width:220px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block}
.inset{padding:14px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.quote{padding:10px 12px;border-left:3px solid var(--accent2);background:var(--primary-soft);border-radius:0 6px 6px 0;font-size:.88rem}
.msg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.msg:first-child{border-top:0;padding-top:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary-text);display:grid;place-items:center;font-weight:600;font-size:.78rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.88rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.grade-card{display:flex;flex-direction:column;gap:12px}
.sec-row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.sec-row:first-child{border-top:0;padding-top:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;margin-top:8px}
.stepper button{border:0;background:var(--surface);width:30px;height:28px;cursor:pointer;font-weight:600}
.stepper button:hover{background:var(--sunk)}
.stepper span{min-width:30px;text-align:center;font-family:var(--f-mono);font-size:.85rem;border-inline:1px solid var(--line-2);line-height:28px}
.sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.sec{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;background:var(--surface)}
.sec .top-l{display:flex;justify-content:space-between;align-items:center}
.sec select{padding:6px 8px;font-size:.82rem}
.sub-toggle{display:flex;gap:4px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:500;font-size:.88rem;opacity:0;pointer-events:none;transition:.22s;z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(8,12,20,.72);display:grid;place-items:center;padding:20px;z-index:60}
.modal img{max-width:100%;max-height:85vh;border-radius:8px}

@media (max-width:1080px){.grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:980px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:820px){
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{padding:8px 12px;position:sticky;top:0;z-index:15}
  .side nav{flex-direction:row;overflow-x:auto;position:static;gap:4px;scrollbar-width:none}
  .side .label,.side .foot{display:none}
  .side button{padding:7px 11px;font-size:.82rem}
  .side button svg{display:none}
  .side button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent2)}
  main{padding:20px 16px 60px}
  .top{padding:10px 16px}
  .brand span{display:none}
  .g-row{grid-template-columns:minmax(0,1fr) auto}.g-track{grid-column:1/-1;order:3}.g-axis{display:none}
  .sec-row{grid-template-columns:minmax(0,1fr)}
  h2{font-size:1.3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="brand"><div class="crest" id="crest">WB</div><div style="min-width:0"><b id="schoolName">Westbrook Public School</b><span id="schoolYear">Academic year 2026–27</span></div></div>
  <div class="seg" role="group" aria-label="Portal">
    <button id="pAdmin" data-act="portal" data-v="admin">Admin</button>
    <button id="pTeacher" data-act="portal" data-v="teacher">Teacher</button>
    <button id="pStudent" data-act="portal" data-v="student">Student</button>
    <button id="pParent" data-act="portal" data-v="parent">Parent</button>
  </div>
  <div class="who" id="who"></div>
</header>
<div class="shell">
  <aside class="side"><nav id="nav"></nav></aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal" hidden data-act="closeModal"><img id="modalImg" alt="Attachment preview"></div>

<script>
const KEY='westbrook.portal.v2';
const GRADES=[3,4,5,6,7,8,9,10];
const LETTERS='ABCDEFGH';
const DAYS=['Mon','Tue','Wed','Thu','Fri'];
const PERIODS=[['08:00','08:45'],['08:45','09:30'],['09:45','10:30'],['10:30','11:15'],['11:45','12:30'],['12:30','13:15']];
const LEVELS=['Excellent','Good','Satisfactory','Needs improvement'];
const PALETTES=[['blue','Blue & yellow','#1F5BC6','#F5B800'],['navy','Navy & gold','#1D4F91','#F5B800'],['teal','Teal & amber','#0E6B67','#F2A900'],['maroon','Maroon & gold','#8C1D40','#E0A419'],['forest','Forest & gold','#2F6B2F','#E3A92B'],['graphite','Graphite & orange','#2F3640','#F28C28']];
const swatches=(compact)=>`<div class="swatches" role="group" aria-label="School colours">${PALETTES.map(([id,l,a,s])=>`<button class="swatch" data-act="palette" data-v="${id}" aria-pressed="${(db.school.palette||'blue')===id}" title="${l}"><i style="background:linear-gradient(135deg,${a} 55%,${s} 55%)"></i>${compact?'':l}</button>`).join('')}</div>`;
const NOTICE_CATS=['General','Inspection','Exam','Event','Holiday'];

/* ---------- utils ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const dayOffset=n=>addDays(today(),n);
const diffDays=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
const isWeekend=s=>{const g=new Date(s+'T00:00').getDay();return g===0||g===6};
const nextSchoolDay=s=>{let d=s;while(isWeekend(d))d=addDays(d,1);return d};
const pastSchoolDays=n=>{const out=[];let d=today();while(out.length<n){d=addDays(d,-1);if(!isWeekend(d))out.push(d)}return out.reverse()};
const weekdayKey=s=>{const g=new Date(s+'T00:00').getDay();return g>=1&&g<=5?DAYS[g-1]:null};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const fmtDate=s=>s?new Date(s+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'—';
const fmtDateL=s=>s?new Date(s+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}):'—';
const fmtTime=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return`${((h+11)%12)+1}:${pad(m)} ${h<12?'AM':'PM'}`};
const opts=(list,val)=>list.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`).join('');
const initials=n=>n.split(/\s+/).filter(w=>!/^(mr|ms|mrs|dr)\.?$/i.test(w)).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const shortName=n=>{const p=n.split(' ').filter(w=>!/^(mr|ms|mrs|dr)\.?$/i.test(w));return p.length>1?p[0][0]+'. '+p.slice(1).join(' '):n};
function cbse(pct){return pct>=91?'A1':pct>=81?'A2':pct>=71?'B1':pct>=61?'B2':pct>=51?'C1':pct>=41?'C2':pct>=33?'D':'E'}

/* ---------- seed ---------- */
function seed(){
  let r=11;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const subjects=[
    {id:'eng',name:'English',code:'ENG'},{id:'mat',name:'Mathematics',code:'MAT'},{id:'sci',name:'Science',code:'SCI'},
    {id:'phy',name:'Physics',code:'PHY'},{id:'csc',name:'Computer Science',code:'CSC'},{id:'hin',name:'Hindi',code:'HIN'},{id:'sst',name:'Social Studies',code:'SST'}
  ];
  const teachers=[
    ['t1','Mr. Arjun Menon','arjun.menon@westbrook.edu.in',['csc','mat']],
    ['t2','Ms. Kavya Rao','kavya.rao@westbrook.edu.in',['mat']],
    ['t3','Mr. David Thomas','david.thomas@westbrook.edu.in',['phy','sci']],
    ['t4','Mrs. Leena Fernandes','leena.fernandes@westbrook.edu.in',['eng']],
    ['t5','Mrs. Priya Sharma','priya.sharma@westbrook.edu.in',['hin']],
    ['t6','Mr. Rahul Verma','rahul.verma@westbrook.edu.in',['sst']],

    ['t8','Mr. Farhan Ali','farhan.ali@westbrook.edu.in',['csc']]

    const sb=pattern[d][(i+1)%6];timetable['10-B'][`${d}-${i+1}`]={subject:sb,teacher:staff['10-B'][sb]};

    ['10-A','Karthik Iyer','Lakshmi Iyer'],['10-A','Sana Qureshi','Imran Qureshi'],['10-A','Dev Nair','Anil Nair'],['10-A','Meera Joshi','Neha Joshi'],
    ['10-B','Aditya Rao','Suresh Rao'],['10-B','Fatima Khan','Ayesha Khan'],['10-B','Rohan Das','Bikash Das'],['10-B','Sneha Pillai','Gopal Pillai'],['10-B','Vikram Singh','Harpreet Singh']
  ];
  const students=fam.map(([cls,name,parent],i)=>({id:'s'+(i+1),cls,name,parent,phone:'+91 98'+String(45012300+i*7311).slice(0,8)}));
  const attendance={};
  pastSchoolDays(12).forEach(date=>{const wd=weekdayKey(date);['10-A','10-B'].forEach(cls=>{
    const subs=[...new Set(PERIODS.map((_,i)=>timetable[cls][`${wd}-${i+1}`]?.subject).filter(Boolean))];
    subs.forEach(sub=>{const rec={};students.filter(s=>s.cls===cls).forEach(s=>{const x=rnd();rec[s.id]=s.name==='Dev Nair'?(x<.3?'A':x<.36?'L':'P'):(x<.06?'A':x<.1?'L':'P')});attendance[`${cls}|${sub}|${date}`]=rec});
  })});
  const exams=[],marks={};
  const ut=['eng','mat','phy','csc','hin','sst'];
  let d=nextSchoolDay(dayOffset(-24));
  ut.forEach(sub=>{const id=uid();exams.push({id,grade:10,cls:null,name:'Unit Test 2',subject:sub,date:d,time:'09:00',max:25});marks[id]={};
    students.forEach(s=>marks[id][s.id]=Math.round(11+rnd()*14));d=nextSchoolDay(addDays(d,1))});
  exams.forEach(e=>e.sent=e.subject==='csc'||e.subject==='eng');
  d=nextSchoolDay(dayOffset(16));
  ut.forEach(sub=>{exams.push({id:uid(),grade:10,cls:null,name:'Term 1 Examination',subject:sub,date:d,time:'09:00',max:80});d=nextSchoolDay(addDays(d,1))});
  d=nextSchoolDay(dayOffset(17));
  ['eng','mat','sci','hin','sst'].forEach(sub=>{exams.push({id:uid(),grade:9,cls:null,name:'Term 1 Examination',subject:sub,date:d,time:'09:00',max:80});d=nextSchoolDay(addDays(d,1))});
  const ctId=uid();exams.push({id:ctId,grade:10,cls:'10-A',name:'Class test: Selection statements',subject:'csc',date:nextSchoolDay(dayOffset(-6)),time:'08:45',max:20});
  marks[ctId]={};students.filter(s=>s.cls==='10-A').forEach(s=>marks[ctId][s.id]=Math.round(9+rnd()*11));
  const h1=uid(),h2=uid(),h3=uid();
  const remarks=[
    {id:uid(),sid:'s3',tid:'t4',subject:'eng',level:'Needs improvement',text:'Pete has missed two reading assignments this month. Please make sure he finishes Chapter 5 of the novel by Friday.',date:dayOffset(-3),shared:true},
    {id:uid(),sid:'s2',tid:'t1',subject:'csc',level:'Excellent',text:'Jane wrote clean, well-commented programs for the selection unit and helped classmates debug theirs.',date:dayOffset(-2),shared:false},
    {id:uid(),sid:'s7',tid:'t4',subject:'eng',level:'Satisfactory',text:'Dev participates well in class discussions but his attendance has dropped below 75%. Regular attendance will help before Term 1.',date:dayOffset(-1),shared:true}
  ];
  const messages=[];
  remarks.filter(x=>x.shared).forEach(x=>messages.push({id:uid(),sid:x.sid,tid:x.tid,subject:x.subject,kind:'Remark',title:`${x.level} — remark from class`,body:x.text,date:x.date}));
  exams.filter(e=>e.sent).forEach(e=>students.forEach(s=>{const m=marks[e.id][s.id];messages.push({id:uid(),sid:s.id,tid:staff[s.cls][e.subject],subject:e.subject,kind:'Exam score',title:`${e.name}: ${m} / ${e.max}`,body:`${s.name.split(' ')[0]} scored ${m} out of ${e.max} (${Math.round(m/e.max*100)}%, grade ${cbse(m/e.max*100)}) in ${e.name}.`,date:addDays(e.date,4)})}));
  return {
    school:{name:'Westbrook Public School',year:'2026–27',board:'CBSE',palette:'blue',paletteV:2},
    subjects,teachers,sections,classTeacher:{'10-A':'t4','10-B':'t2','9-A':'t1','8-A':'t6','7-B':'t7'},
    timetable,students,attendance,exams,marks,remarks,messages,
    deadlines:[
      {id:uid(),scope:'all',title:'Term 1 fee payment closes',date:dayOffset(4),by:'admin'},
      {id:uid(),scope:'g10',title:'Science exhibition entries due',date:dayOffset(6),by:'admin'},
      {id:uid(),scope:'g9',title:'Practical record books to be submitted',date:dayOffset(10),by:'admin'},
      {id:uid(),scope:'10-A',subject:'csc',title:'Project: Java mini calculator',date:dayOffset(9),by:'t1'},
      {id:uid(),scope:'10-A',subject:'mat',title:'Maths lab manual submission',date:dayOffset(5),by:'t2'}
    ],
    notices:[
      {id:uid(),title:`CBSE affiliation inspection on ${fmtDateL(nextSchoolDay(dayOffset(3)))}`,category:'Inspection',scope:'all',date:dayOffset(-1),body:'An inspection team will visit classrooms and labs. Students must be in full uniform with ID cards. Practical record books should be up to date and available on desks.'},
      {id:uid(),title:'Parent–teacher meeting for Class 10',category:'Event',scope:'g10',date:dayOffset(-2),body:'Saturday, 9:00 AM to 12:30 PM. Term 1 preparation and Unit Test 2 results will be discussed with each class teacher.'},
      {id:uid(),title:'Term 1 examination schedule published',category:'Exam',scope:'all',date:dayOffset(-4),body:'The datesheet for Classes 9 and 10 is now available under Exams. Other classes will be published next week.'}
    ],
    plan:[
      ...[['Ch 3 · Data types and operators',-34,-17],['Ch 4 · Selection: if, else-if, switch',-16,3],['Ch 5 · Iteration: for, while, do-while',4,18],['Ch 6 · Arrays',19,36]].map(([t,a,b])=>({id:uid(),cls:'10-A',subject:'csc',title:t,start:dayOffset(a),end:dayOffset(b)})),
      ...[['Quadratic equations',-26,-4],['Arithmetic progressions',-3,11],['Triangles and similarity',12,30]].map(([t,a,b])=>({id:uid(),cls:'10-A',subject:'mat',title:t,start:dayOffset(a),end:dayOffset(b)})),
      ...[['Light: reflection and refraction',-28,-6],['The human eye',-5,8],['Electricity',9,32]].map(([t,a,b])=>({id:uid(),cls:'10-A',subject:'phy',title:t,start:dayOffset(a),end:dayOffset(b)})),
      ...[['First Flight: Ch 4–6',-20,0],['Writing: formal letters',1,10],['Footprints: Ch 3–5',11,28]].map(([t,a,b])=>({id:uid(),cls:'10-A',subject:'eng',title:t,start:dayOffset(a),end:dayOffset(b)}))
    ],
    materials:[
      {id:uid(),cls:'10-A',subject:'csc',title:'Java — if, else-if and nested if',text:'A condition must evaluate to a boolean. Use == for comparison, not =.\nWork through examples 4.1 to 4.6 from class before Thursday.',file:{name:'Selection statements.pdf',size:182000},date:dayOffset(-1)},
      {id:uid(),cls:'10-A',subject:'mat',title:'Arithmetic progressions: nth term',text:'aₙ = a + (n − 1)d\nIdentify a and d first, then substitute. Check your answer by listing the first few terms.',file:null,date:dayOffset(-2)},
      {id:uid(),cls:'10-A',subject:'phy',title:'The human eye: defects of vision',text:'Myopia is corrected with a concave lens, hypermetropia with a convex lens.\nRevise ray diagrams 11.2 and 11.3.',file:{name:'Eye defects worksheet.docx',size:54000},date:dayOffset(-3)}
    ],
    homework:[
      {id:h1,cls:'10-A',subject:'csc',title:'Java if-else practice',instructions:'Write 3 programs using if-else-if: grade calculator, leap year check, largest of three numbers.',due:dayOffset(2),created:dayOffset(-1)},
      {id:h2,cls:'10-A',subject:'mat',title:'Exercise 5.2, Q1–12',instructions:'Find the nth term for each AP. Show a and d clearly.',due:dayOffset(1),created:dayOffset(-2)},
      {id:h3,cls:'10-A',subject:'phy',title:'Human eye ray diagrams',instructions:'Draw labelled ray diagrams for myopia and hypermetropia, before and after correction.',due:dayOffset(-1),created:dayOffset(-4)}
    ],
    submissions:[
      {id:uid(),hw:h1,sid:'s2',file:{name:'IfElse_Jane.zip',size:12400},comment:'Added a bonus program for even/odd.',time:new Date(Date.now()-18e6).toISOString(),status:'pending',score:null,remark:'',shared:false},
      {id:uid(),hw:h1,sid:'s4',file:{name:'notebook_photo.jpg',size:845000},comment:'',time:new Date(Date.now()-72e6).toISOString(),status:'reviewed',score:9,remark:'Neat work. Watch your indentation in program 3.',shared:true},
      {id:uid(),hw:h3,sid:'s1',file:{name:'EyeDiagrams_Amn.pdf',size:310000},comment:'',time:new Date(Date.now()-108e6).toISOString(),status:'pending',score:null,remark:'',shared:false}
    ]
  };
}
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return seed()}
let db=load();
if(db.school&&db.school.paletteV!==2){db.school.palette='blue';db.school.paletteV=2}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('This browser could not save. Changes last until you reload.')}}

const ui={portal:'admin',view:'overview',tid:'t1',tctx:'',sid:'s1',pid:'s3',ttCls:'10-A',ttCell:null,ttSub:'',attDate:today(),draft:null,examSel:'',hwFilter:'pending',openRemark:null,openUpload:null,matFilter:'all',examGrade:'all'};
try{Object.assign(ui,JSON.parse(localStorage.getItem(KEY+'.ui')||'{}'))}catch(e){}
ui.draft=null;ui.ttCell=null;ui.attDate=today();
function saveUi(){try{const{portal,view,tid,tctx,sid,pid,ttCls}=ui;localStorage.setItem(KEY+'.ui',JSON.stringify({portal,view,tid,tctx,sid,pid,ttCls}))}catch(e){}}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}

/* ---------- lookups ---------- */
const subj=id=>db.subjects.find(s=>s.id===id)||{id,name:id,code:id.toUpperCase()};
const teacher=id=>db.teachers.find(t=>t.id===id);
const tName=id=>teacher(id)?.name||'Unassigned';
const student=id=>db.students.find(s=>s.id===id);
const gradeOf=cls=>Number(cls.split('-')[0]);
const allClasses=()=>GRADES.flatMap(g=>Array.from({length:db.sections[g]||0},(_,i)=>`${g}-${LETTERS[i]}`));
const classStudents=cls=>db.students.filter(s=>s.cls===cls);
const rollOf=s=>pad(classStudents(s.cls).indexOf(s)+1);
const scopeMatch=(scope,cls)=>scope==='all'||scope==='g'+gradeOf(cls)||scope===cls;
const scopeLabel=s=>s==='all'?'Whole school':s.startsWith('g')?`Class ${s.slice(1)} (all sections)`:`Class ${s}`;
const scopeOpts=()=>[['all','Whole school'],...GRADES.map(g=>['g'+g,`Class ${g} (all sections)`]),...allClasses().map(c=>[c,`Class ${c}`])];
const classSubjects=cls=>[...new Set(Object.values(db.timetable[cls]||{}).map(s=>s.subject))].sort((a,b)=>subj(a).name.localeCompare(subj(b).name));
const subjTeacher=(cls,sub)=>Object.values(db.timetable[cls]||{}).find(s=>s.subject===sub)?.teacher;
function teacherCtxs(tid){
  const set=new Set();Object.entries(db.timetable).forEach(([cls,slots])=>Object.values(slots).forEach(s=>{if(s.teacher===tid)set.add(cls+'|'+s.subject)}));
  return [...set].sort((a,b)=>{const[ca]=a.split('|'),[cb]=b.split('|');return gradeOf(cb)-gradeOf(ca)||ca.localeCompare(cb)||a.localeCompare(b)});
}
const ctxLabel=k=>{const[c,s]=k.split('|');return`${c} · ${subj(s).name}`};
const periodsPerWeek=tid=>Object.values(db.timetable).reduce((n,slots)=>n+Object.values(slots).filter(s=>s.teacher===tid).length,0);
const classTeacherOf=tid=>Object.entries(db.classTeacher).filter(([c,t])=>t===tid&&allClasses().includes(c)).map(([c])=>c);
function attStats(sid,sub){let p=0,a=0,l=0;const cls=student(sid)?.cls;
  for(const[k,rec]of Object.entries(db.attendance)){const[c,s]=k.split('|');if(c!==cls||(sub&&s!==sub))continue;const v=rec[sid];if(v==='P')p++;else if(v==='A')a++;else if(v==='L')l++}
  const t=p+a+l;return{p,a,l,t,pct:t?Math.round((p+l)/t*100):null}}
const examsFor=cls=>db.exams.filter(e=>e.grade===gradeOf(cls)&&(!e.cls||e.cls===cls)).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
function results(sid,sub){const s=student(sid);return examsFor(s.cls).filter(e=>(!sub||e.subject===sub)&&db.marks[e.id]?.[s.id]!=null).map(e=>({e,m:db.marks[e.id][s.id],pct:Math.round(db.marks[e.id][s.id]/e.max*100)}))}
function avgPct(sid,sub){const r=results(sid,sub);return r.length?Math.round(r.reduce((a,x)=>a+x.pct,0)/r.length):null}
const subFor=(hw,sid)=>db.submissions.find(x=>x.hw===hw&&x.sid===sid);
function dueState(h,sid){
  const s=sid&&subFor(h.id,sid);
  if(s)return s.status==='reviewed'?['Reviewed','p-ok']:['Submitted','p-info'];
  if(!h.due)return['No due date','p-mute'];
  const d=diffDays(h.due,today());
  if(d<0)return['Overdue','p-bad'];if(d===0)return['Due today','p-warn'];if(d===1)return['Due tomorrow','p-warn'];return[`Due in ${d} days`,'p-mute'];
}
const deadlinesFor=cls=>db.deadlines.filter(d=>scopeMatch(d.scope,cls)).sort((a,b)=>a.date.localeCompare(b.date));
const noticesFor=cls=>db.notices.filter(n=>scopeMatch(n.scope,cls)).sort((a,b)=>b.date.localeCompare(a.date));
const catPill=c=>`<span class="pill ${c==='Inspection'?'p-bad':c==='Exam'?'p-warn':c==='Holiday'?'p-ok':'p-info'}">${esc(c)}</span>`;
const levelPill=l=>`<span class="pill ${l==='Excellent'?'p-ok':l==='Good'?'p-info':l==='Satisfactory'?'p-mute':'p-warn'}">${esc(l)}</span>`;
const pctPill=p=>p==null?'<span class="muted">—</span>':`<span class="pill ${p<75?'p-bad':'p-ok'}">${p}%</span>`;

function ttGrid(cell,opts={}){

function gantt(units,emptyMsg){
  if(!units.length)return empty(emptyMsg||'No units planned yet.');
  const t=today();const s=units.reduce((m,u)=>u.start<m?u.start:m,units[0].start),e=units.reduce((m,u)=>u.end>m?u.end:m,units[0].end);
  const span=Math.max(1,diffDays(e,s)+1),pos=x=>Math.min(100,Math.max(0,diffDays(x,s)/span*100));
  const tp=diffDays(t,s)>=0&&diffDays(e,t)>=0?pos(t):null;
  return `<div class="gantt">${[...units].sort((a,b)=>a.start.localeCompare(b.start)).map(u=>{
    const st=u.end<t?['done','Completed','p-ok']:u.start<=t?['now','In progress','p-info']:['','Upcoming','p-mute'];
    return `<div class="g-row"><div><b>${esc(u.title)}</b><span class="muted mono">${fmtDate(u.start)} – ${fmtDate(u.end)}</span></div>
      <div class="g-track"><i class="g-bar ${st[0]}" style="left:${pos(u.start)}%;width:${Math.max(1.5,(diffDays(u.end,u.start)+1)/span*100)}%"></i>${tp!=null?`<span class="g-today" style="left:${tp}%" title="Today"></span>`:''}</div>
      <div class="r">${u._del?`<button class="btn link danger" data-act="delUnit" data-v="${u.id}">Remove</button>`:`<span class="pill ${st[2]}">${st[1]}</span>`}</div></div>`}).join('')}
    <div class="g-row" style="padding-top:2px"><span></span><div class="g-axis"><span>${fmtDate(s)}</span>${tp!=null?'<span style="color:var(--ink);font-weight:600">▲ Today</span>':''}<span>${fmtDate(e)}</span></div><span></span></div></div>`;
}

function attendancePanel(sid){

  <section class="panel"><div class="panel-h"><h3>Recent periods</h3></div><div class="list">${log.slice(0,10).map(x=>`<div class="row"><span class="att ${x.v}">${x.v}</span><div class="grow"><b>${esc(subj(x.sub).name)}</b><span class="muted">${fmtDateL(x.d)}</span></div><span class="pill ${x.v==='P'?'p-ok':x.v==='A'?'p-bad':'p-warn'}">${{P:'Present',A:'Absent',L:'Late'}[x.v]}</span></div>`).join('')||empty('No attendance recorded yet.')}</div></section></div>`;

function noticeList(list){return list.length?`<div class="list">${list.map(n=>`<div class="row" style="align-items:flex-start"><div class="grow"><div class="actions" style="gap:8px;margin-bottom:4px">${catPill(n.category)}<span class="muted">${fmtDateL(n.date)} · ${esc(scopeLabel(n.scope))}</span></div><b>${esc(n.title)}</b><p class="muted" style="margin-top:3px;font-size:.88rem;color:var(--ink-2)">${esc(n.body)}</p></div></div>`).join('')}</div>`:empty('No notices.')}

function readFile(f){return new Promise(res=>{const meta={name:f.name,size:f.size,type:f.type};
  if(f.type.startsWith('image/')&&f.size<600000){const r=new FileReader();r.onload=()=>res({...meta,data:r.result});r.onerror=()=>res(meta);r.readAsDataURL(f)}else res(meta)})}

    if(sc!==''&&(isNaN(+sc)||+sc<0||+sc>10))return toast('Score must be between 0 and 10.');
    s.score=sc===''?null:+sc;s.remark=document.getElementById('rm-'+v).value.trim();s.status='reviewed';
    if(document.getElementById('sp-'+v).checked){s.shared=true;addMsg(s.sid,ui.tid,h.subject,'Homework',`${h.title}${s.score!=null?': '+s.score+' / 10':''}`,s.remark||'Homework checked and complete.')}
    persist();toast(s.shared?'Checked and sent to parent':'Marked checked')},
  shareSub:v=>{const s=db.submissions.find(x=>x.id===v),h=db.homework.find(x=>x.id===s.hw);s.shared=true;addMsg(s.sid,ui.tid,h.subject,'Homework',`${h.title}${s.score!=null?': '+s.score+' / 10':''}`,s.remark||'Homework checked and complete.');persist();toast('Sent to parent')},
  examSel:v=>{ui.examSel=v},
  saveMarks:()=>{if(saveMarksFromInputs()){persist();toast('Scores saved')}},
  sendMarks:()=>{const e=saveMarksFromInputs();if(!e)return;const{cls}=tCtx();let n=0;
    classStudents(cls).forEach(s=>{const m=db.marks[e.id][s.id];if(m==null)return;const p=Math.round(m/e.max*100);addMsg(s.id,ui.tid,e.subject,'Exam score',`${e.name}: ${m} / ${e.max}`,`${s.name.split(' ')[0]} scored ${m} out of ${e.max} (${p}%, grade ${cbse(p)}) in ${subj(e.subject).name}.`);n++});
    e.sent=true;persist();toast(`Scores sent to ${n} parents`)},
  openRemark:v=>{ui.openRemark=ui.openRemark===v?null:v},
  shareRemark:v=>{const r=db.remarks.find(x=>x.id===v);r.shared=true;addMsg(r.sid,r.tid,r.subject,'Remark',`${r.level} — remark from class`,r.text);persist();toast('Remark sent to parent')},
  rosterCls:v=>{ui.rosterCls=v},
  delStudent:v=>{db.students=db.students.filter(s=>s.id!==v);persist();toast('Student removed')},
  openUpload:v=>{ui.openUpload=v||null},
  matFilter:v=>{ui.matFilter=v},
  zoom:(v,el)=>{document.getElementById('modalImg').src=el.src;document.getElementById('modal').hidden=false;return 'norender'},
  closeModal:()=>{document.getElementById('modal').hidden=true;return 'norender'}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.hasAttribute('data-two')&&!el.dataset.armed){el.dataset.armed='1';el.dataset.orig=el.textContent;el.textContent='Click again to confirm';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent=el.dataset.orig}},3000);return}
  const fn=ACT[el.dataset.act];if(!fn)return;
  if(fn(el.dataset.v,el)!=='norender')render();
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.change;if(!k)return;const v=e.target.value;
  if(k==='ct'){if(v)db.classTeacher[e.target.dataset.cls]=v;else delete db.classTeacher[e.target.dataset.cls];persist();toast(v?`${tName(v)} is now class teacher of ${e.target.dataset.cls}`:'Class teacher removed')}
  if(k==='ttCls'){ui.ttCls=v;ui.ttCell=null}
  if(k==='ttSub')ui.ttSub=v;
  if(k==='tid'){ui.tid=v;ui.tctx='';ui.draft=null}
  if(k==='tctx'){ui.tctx=v;ui.draft=null;ui.examSel=''}
  if(k==='sid'){ui.sid=v;ui.openUpload=null}
  if(k==='pid')ui.pid=v;
  if(k==='attDate'){ui.attDate=v||today();ui.draft=null}
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').hidden=true});
document.addEventListener('submit',async e=>{
  const f=e.target,kind=f.dataset.form;if(!kind)return;e.preventDefault();
  const fd=new FormData(f),g=k=>String(fd.get(k)||'').trim();const{cls,sub}=ui.portal==='teacher'?tCtx():{};
  switch(kind){
    case'addTeacher':{const subs=fd.getAll('subjects');db.teachers.push({id:'t'+uid(),name:g('name'),email:g('email'),subjects:subs});toast(`${g('name')} added${subs.length?'':'. Pick the subjects they head in the table'}`);break}
    case'addSubject':{const code=g('code').toUpperCase(),id=code.toLowerCase();if(db.subjects.some(s=>s.id===id))return toast('A subject with that code already exists.');db.subjects.push({id,name:g('name'),code});toast('Subject added');break}
    case'addExam':{const grade=+g('grade'),subjS=g('subject'),list=subjS==='*'?db.subjects.map(s=>s.id).filter(s=>Object.entries(db.timetable).some(([c,tt])=>gradeOf(c)===grade&&Object.values(tt).some(x=>x.subject===s))):[subjS];
      const use=list.length?list:db.subjects.map(s=>s.id);let d=g('date');
      use.forEach(s=>{d=nextSchoolDay(d);db.exams.push({id:uid(),grade,cls:null,name:g('name'),subject:s,date:d,time:g('time')||'09:00',max:+g('max')||80});d=addDays(d,1)});
      ui.examGrade=String(grade);toast(`${use.length} paper${use.length>1?'s':''} added to the Class ${grade} datesheet`);break}
    case'addDeadline':db.deadlines.push({id:uid(),scope:g('scope'),title:g('title'),date:g('date'),by:'admin'});toast('Deadline added');break;
    case'addNotice':db.notices.push({id:uid(),title:g('title'),body:g('body'),category:g('category'),scope:g('scope'),date:today()});toast('Notice published');break;
    case'settings':db.school={...db.school,name:g('name'),year:g('year'),board:g('board')};toast('Settings saved');break;
    case'addUnit':if(g('end')<g('start'))return toast('The end date must be on or after the start date.');db.plan.push({id:uid(),cls,subject:sub,title:g('title'),start:g('start'),end:g('end')});toast('Unit added to the timeline');break;
    case'addTDeadline':db.deadlines.push({id:uid(),scope:cls,subject:sub,title:g('title'),date:g('date'),by:ui.tid});toast('Deadline added for '+cls);break;
    case'addMat':{const file=fd.get('file');if(!g('text')&&!(file&&file.size))return toast('Add some notes or attach a file.');db.materials.push({id:uid(),cls,subject:sub,title:g('title'),text:g('text'),file:file&&file.size?await readFile(file):null,date:today()});toast('Published to '+cls);break}
    case'addHw':db.homework.push({id:uid(),cls,subject:sub,title:g('title'),instructions:g('instructions'),due:g('due'),created:today()});toast('Homework assigned to '+cls);break;
    case'addTest':{const id=uid();db.exams.push({id,grade:gradeOf(cls),cls,name:g('name'),subject:sub,date:g('date'),time:'08:45',max:+g('max')||20});ui.examSel=id;toast('Class test added. Enter the scores below.');break}
    case'addRemark':{const sid=f.dataset.v,share=fd.get('share')==='on';const r={id:uid(),sid,tid:ui.tid,subject:sub,level:g('level'),text:g('text'),date:today(),shared:share};db.remarks.push(r);
      if(share)addMsg(sid,ui.tid,sub,'Remark',`${r.level} — remark from class`,r.text);ui.openRemark=null;toast(share?'Remark saved and sent to parent':'Remark saved');break}
    case'addStudent':db.students.push({id:'s'+uid(),cls:ui.rosterCls,name:g('name'),parent:g('parent'),phone:g('phone')});toast(`${g('name')} added to ${ui.rosterCls}`);break;
    case'submitHw':{const file=fd.get('file');if(!file||!file.size)return toast('Choose a file to upload.');
      db.submissions.push({id:uid(),hw:f.dataset.v,sid:me().id,file:await readFile(file),comment:g('comment'),time:new Date().toISOString(),status:'pending',score:null,remark:'',shared:false});ui.openUpload=null;toast('Homework submitted');break}
  }
  persist();render();
});
render();
</script>
